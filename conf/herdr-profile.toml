# herdr profile snippet for herdr-kitten (spec U.4: herdr's config.toml stays
# herdr-owned — MERGE these keys into ~/.config/herdr/config.toml BY HAND;
# no hk verb ever writes that file, spec F.4).

# kitty owns the Wayland window title; herdr's own title emission stays dead (spec D7).
#ui.window_title = ""

# herdr toasts ride OSC 99 into kitty notifications (spec 8.6).
#[ui.toast]
#delivery = "terminal"

# Desktop profile: single herdr tab means no kitty tab bar noise (spec D18).
#ui.hide_tab_bar_when_single_tab = true

# Restore agents with the layout on snapshot restore (spec D14; explicit despite
# being the default, so the posture is declared).
#session.resume_agents_on_restore = true

# Graphics stay gated until the detach-reattach staleness probe passes (spec D20).
#experimental.kitty_graphics = false
