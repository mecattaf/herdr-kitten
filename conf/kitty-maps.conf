# Suggested kitty maps for herdr-kitten (spec DECISION-3, adopted-as-proposed —
# relitigable; matches the retired design's muscle memory).
# Include from kitty.conf (`include /path/to/kitty-maps.conf`) or copy what you want.
# The kitten must be reachable by kitty: install.sh places hk.py in ~/.config/kitty/.

map ctrl+b            kitten hk.py toggle
map ctrl+shift+g      kitten hk.py fork
map ctrl+shift+h      kitten hk.py scrollback
