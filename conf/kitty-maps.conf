# Suggested kitty maps for herdr-kitten (spec DECISION-3, adopted-as-proposed —
# relitigable; matches the retired design's muscle memory).
#
# install.sh copies this file to <kitty config dir>/hk-maps.conf, so the whole
# wiring step is one line in kitty.conf:
#
#     include hk-maps.conf
#
# The kitten path below is relative to the kitty config directory, which is
# where kitty resolves a `kitten` action's path from. install.sh puts the
# kitten tree at <kitty config dir>/hk/ (round2-02: a directory, never loose
# files — BUG-3/BUG-15), so the path is hk/hk.py.

map ctrl+b            kitten hk/hk.py toggle
map ctrl+shift+g      kitten hk/hk.py fork
map ctrl+shift+h      kitten hk/hk.py scrollback
